name: .NET PR Build Check

on:
  pull_request:
    branches: [ main ]  # Only trigger when PR is opened/updated to merge into 'main'

jobs:
  build:
    name: Build .NET Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Change this to your project's .NET version

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release
